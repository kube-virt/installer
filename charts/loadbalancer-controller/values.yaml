# Default values for loadbalancer-controller.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# -------------------------------------------------------------------
# Mode: "openstack" or "harvester"
# In harvester mode, a kubeconfig secret is mounted; openstack-creds
# are NOT used.
# -------------------------------------------------------------------
mode: openstack   # openstack | harvester

# -------------------------------------------------------------------
# loadbalancer-controller Deployment
# -------------------------------------------------------------------
loadbalancerController:
  replicaCount: 1

  image:
    repository: sumon124816/openstack
    tag: lb
    pullPolicy: Always

  serviceAccountName: loadbalancer-controller

  env:
    lbcNamespace: envoy-gateway-system
    osTenantId: "a51179ac133c413cb437cbc9bb6356fd"
    osNetworkId: "06d374e1-631b-4937-bd10-65e5123d20fb"
    osSubnetId: "6811085c-901f-4636-8779-f13a20f830c0"

  resources: {}

# -------------------------------------------------------------------
# openstack-creds Secret (used only when mode=openstack)
# -------------------------------------------------------------------
openstackCreds:
  osAuthUrl: "http://10.2.0.101/identity"
  osUsername: "admin"
  osPassword: "password"
  osDomainName: "Default"
  osRegionName: "RegionOne"
  osProjectId: "a51179ac133c413cb437cbc9bb6356fd"

# -------------------------------------------------------------------
# db-credentials Secret
# -------------------------------------------------------------------
dbCredentials:
  dbHost: "10.2.0.101"
  dbPort: "3306"
  dbUser: "root"
  dbPassword: "password"
  dbName: "lbapi"
  dbSslmode: "disable"

