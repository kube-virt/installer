# -------------------------------------------------------------------
# keepalived-grpc DaemonSet
# -------------------------------------------------------------------
keepalivedGrpc:

  image:
    repository: sumon124816/openstack
    tag: keepalived
    pullPolicy: Always

  hostNetwork: true
  hostPID: true

  resources:
