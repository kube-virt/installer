# Default values for loadbalancer-controller.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# -------------------------------------------------------------------
# Mode: "openstack" or "harvester"
# In harvester mode, a kubeconfig secret is mounted; openstack-creds
# are NOT used.
# -------------------------------------------------------------------
mode: harvester   # openstack | harvester

# -------------------------------------------------------------------
# loadbalancer-controller Deployment
# -------------------------------------------------------------------
loadbalancerController:
  replicaCount: 2

  image:
    repository: sumon124816/openstack
    tag: lb-test
    pullPolicy: Always

  serviceAccountName: loadbalancer-controller

  env:
    osTenantId: ""
    osNetworkId: ""
    osSubnetId: ""
    clusterNamespace: "new"

  resources: {}

# -------------------------------------------------------------------
# openstack-creds Secret (used only when mode=openstack)
# -------------------------------------------------------------------
openstackCreds:
  osAuthUrl: "http://10.2.5.250:5000"
  osUsername: "admin"
  osPassword: "XjdoF7qgIiY0virvzx5XdhtO3fzAMo1yVTjGn9Zz"
  osDomainName: "Default"
  osRegionName: "RegionOne"
  osProjectId: "779d9954e19740f99d2b5be81976bedc"

# -------------------------------------------------------------------
# db-credentials Secret
# -------------------------------------------------------------------
dbCredentials:
  dbHost: "10.2.5.250"
  dbPort: "3306"
  dbUser: "lbapi"
  dbPassword: "LbApiStrongPass123!"
  dbName: "lbapi"
  dbSslmode: "disable"

# -------------------------------------------------------------------
# harvester kubeconfig (used only when mode=harvester)
# The kubeconfig content is stored in a Secret and mounted into the
# controller pod at /etc/harvester/kubeconfig.
# -------------------------------------------------------------------
harvester:
  kubeconfigSecretName: harvester-kubeconfig
  # Paste the full kubeconfig as a multiline string value, or leave
  # empty and create the secret manually.
  kubeconfig: |

# -------------------------------------------------------------------
# keepalived-grpc DaemonSet
# -------------------------------------------------------------------
keepalivedGrpc:

  image:
    repository: sumon124816/openstack
    tag: keepalived-test
    pullPolicy: Always

  hostNetwork: true
  hostPID: true

  resources:
    requests:
      cpu: 50m
      memory: 64Mi

  # hostPath for keepalived config directory
  keepalivedConfigPath: /etc/keepalived

