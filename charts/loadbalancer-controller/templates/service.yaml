apiVersion: v1
kind: Service
metadata:
  name: loadbalancer-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: loadbalancer-controller
    {{- include "loadbalancer-controller.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: loadbalancer-controller
  ports:
    - protocol: TCP
      port: 50052
      targetPort: 50052