---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: loadbalancerclaims.networking.appscode.com
spec:
  group: networking.appscode.com
  names:
    kind: LoadBalancerClaim
    listKind: LoadBalancerClaimList
    plural: loadbalancerclaims
    singular: loadbalancerclaim
  scope: Namespaced
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: LoadBalancerClaim is the Schema for the loadbalancerclaims API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired state of LoadBalancerClaim
              properties:
                listeners:
                  items:
                    description: |-
                      ListenerSpec is one port/protocol the load balancer answers on. What it
                      forwards to lives on its rules.
                    properties:
                      hostnames:
                        description: |-
                          Hostnames restricts this listener to the given HTTP Host values. Empty
                          means any host. They sit on the listener rather than the rule because the
                          generated route object scopes hostnames to the whole route.
                        items:
                          type: string
                        type: array
                      port:
                        type: integer
                      protocol:
                        type: string
                      rules:
                        description: |-
                          Rules route this listener's traffic. HTTP listeners may carry up to 16;
                          TCP and UDP listeners carry exactly one, because Envoy Gateway rejects a
                          TCPRoute or UDPRoute that does not have exactly one rule.
                        items:
                          description: |-
                            ListenerRule routes a subset of a listener's traffic to a set of weighted
                            backends, with its own health monitor and load balancing algorithm.
                          properties:
                            algorithm:
                              type: string
                            backends:
                              description: Backends are the weighted forwarding targets.
                              items:
                                description: |-
                                  RuleBackend is one weighted forwarding target of a rule. It becomes a single
                                  upstream containing every endpoint listed here.
                                properties:
                                  endpoints:
                                    items:
                                      properties:
                                        ip:
                                          type: string
                                        port:
                                          type: string
                                      required:
                                        - ip
                                        - port
                                      type: object
                                    minItems: 1
                                    type: array
                                  id:
                                    description: |-
                                      ID is the backend's stable identity, assigned by the API server, and is
                                      used verbatim as the name of the generated Backend resource. Keeping it
                                      stable is what lets a weight change avoid tearing the upstream down.
                                    type: string
                                  name:
                                    description: Name is an optional human-readable
                                      label.
                                    type: string
                                  weight:
                                    description: |-
                                      Weight is this backend's share of the rule's traffic relative to its
                                      siblings.
                                      
                                      No omitempty: 0 is meaningful and means "take this backend out of
                                      rotation", which is not the same as an absent weight.
                                    format: int32
                                    type: integer
                                required:
                                  - endpoints
                                  - id
                                  - weight
                                type: object
                              maxItems: 16
                              minItems: 1
                              type: array
                            healthMonitorEnabled:
                              type: boolean
                            healthMonitorExpectedStatusCodes:
                              items:
                                format: int32
                                type: integer
                              type: array
                            healthMonitorHTTPMethod:
                              type: string
                            healthMonitorHTTPPath:
                              type: string
                            healthMonitorHealthyThreshold:
                              format: int32
                              type: integer
                            healthMonitorInterval:
                              format: int32
                              type: integer
                            healthMonitorTimeout:
                              format: int32
                              type: integer
                            healthMonitorUnhealthyThreshold:
                              format: int32
                              type: integer
                            id:
                              description: |-
                                ID is the rule's stable identity, assigned by the API server. It names
                                the generated BackendTrafficPolicy and is written into the route rule so
                                the policy can target it, so it must never be regenerated for a rule that
                                already exists.
                              type: string
                            matches:
                              description: |-
                                Matches are the conditions selecting this rule. HTTP only; an empty list
                                matches every request.
                              items:
                                description: |-
                                  HTTPRouteMatch is one condition set. Everything inside a single match is
                                  ANDed; a rule fires when any one of its matches is satisfied.
                                properties:
                                  headers:
                                    items:
                                      description: HTTPHeaderMatch matches one request
                                        header. Type is EXACT or REGEX.
                                      properties:
                                        name:
                                          type: string
                                        type:
                                          type: string
                                        value:
                                          type: string
                                      required:
                                        - name
                                        - value
                                      type: object
                                    maxItems: 16
                                    type: array
                                  method:
                                    type: string
                                  path:
                                    description: HTTPPathMatch matches the request path.
                                      Type is Exact, Prefix or Regex.
                                    properties:
                                      type:
                                        type: string
                                      value:
                                        type: string
                                    type: object
                                  queryParams:
                                    items:
                                      description: HTTPQueryParamMatch matches one query-string
                                        parameter. Type is EXACT or REGEX.
                                      properties:
                                        name:
                                          type: string
                                        type:
                                          type: string
                                        value:
                                          type: string
                                      required:
                                        - name
                                        - value
                                      type: object
                                    maxItems: 16
                                    type: array
                                type: object
                              maxItems: 64
                              type: array
                            priority:
                              description: |-
                                Priority orders the rule within its listener, lowest first.
                                
                                It breaks ties between equally specific rules; it does not override match
                                specificity, which the data plane resolves first.
                              format: int32
                              type: integer
                          required:
                            - backends
                            - id
                          type: object
                        maxItems: 16
                        type: array
                      tlsEnabled:
                        type: boolean
                    required:
                      - port
                      - protocol
                    type: object
                  type: array
                networkID:
                  type: string
                qosPolicyID:
                  type: string
                securityGroupDisabled:
                  description: |-
                    SecurityGroupDisabled turns port security off entirely on every subport;
                    SecurityGroupIDs is ignored when it is true. When it is false, an empty
                    SecurityGroupIDs leaves port security on with no groups, which blocks all
                    traffic.
                    
                    No omitempty: false is a meaningful value and must stay visible in the
                    serialized object rather than being confused with "unset".
                  type: boolean
                securityGroupIDs:
                  items:
                    type: string
                  type: array
                subnetID:
                  type: string
                tenantID:
                  type: string
              required:
                - networkID
                - subnetID
                - tenantID
              type: object
            status:
              description: status defines the observed state of LoadBalancerClaim
              properties:
                conditions:
                  items:
                    description: Condition contains details for one aspect of the current
                      state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                envoyGatewayClassName:
                  type: string
                expectedReplicas:
                  type: integer
                fipState:
                  type: string
                floatingIPID:
                  description: FloatingIPID is the OpenStack ID of the allocated floating
                    IP.
                  type: string
                keepalivedRid:
                  type: integer
                loadBalancerIP:
                  type: string
                loadBalancerPort:
                  type: string
                qosPolicyID:
                  type: string
                ready:
                  type: boolean
                securityGroupDisabled:
                  description: |-
                    SecurityGroupDisabled and SecurityGroupIDs record what was last applied to
                    the subports. The DBSyncer compares them against the database row to
                    decide whether anything needs re-applying.
                  type: boolean
                securityGroupID:
                  description: |-
                    SecurityGroupID is the pre-array applied marker. It is never written any
                    more; a non-empty value means this claim's security groups were recorded
                    before SecurityGroupIDs existed and must be re-applied once, after which
                    it is cleared. Remove this field once every claim has converged.
                    
                    Deprecated: migration marker only, use SecurityGroupIDs.
                  type: string
                securityGroupIDs:
                  items:
                    type: string
                  type: array
                trunkPortClaims:
                  items:
                    properties:
                      cidr:
                        type: string
                      health:
                        type: boolean
                      interfaceName:
                        type: string
                      isMaster:
                        type: boolean
                      keepalived:
                        type: boolean
                      name:
                        type: string
                      subPortID:
                        type: string
                      trunkID:
                        type: string
                    required:
                      - health
                      - interfaceName
                      - name
                    type: object
                  type: array
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
