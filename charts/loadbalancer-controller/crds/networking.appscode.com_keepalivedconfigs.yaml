                  range into this VLAN's PBR table, so the node reaches backends in other
                  subnets of the VPC. Without it only the subport's own subnet is
                  reachable: a locally-originated socket has no source address yet when the
                  destination is resolved, so the `from <subport>/32` rules cannot match and
                  the lookup falls through to the main table and the infra default route.

                  Optional — empty installs no rule and leaves routing exactly as it was.
                type: string
